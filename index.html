<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX Monitoring Dashboard | ป้ายทางหนีไฟ - ตึกภูมิสิริมังคลานุสรณ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c14; --surface:#0e1420; --card:#111827; --border:#1c2a3a; --border2:#243040;
  --accent:#00ff8c; --accent2:#00b366; --text:#d3f0e2; --muted:#4a806a;
  --ok-top:#0f2e1a; --ok-mid:#0a1f12; --ok-bdr:#2a5a3a; --ok-shd:#0a3a1e; --ok-glow:rgba(0,255,140,.35); --ok-txt:#00ff8c;
  --br-top:#2e1a1a; --br-mid:#1f0f0f; --br-bdr:#8b1a1a; --br-shd:#5a0a0a; --br-glow:rgba(255,50,50,.4); --br-txt:#ff4444;
  --un-top:#1a1e26; --un-mid:#121620; --un-bdr:#2a3550; --un-shd:#0a1020; --un-txt:#6a8ab0;
  --success:#00ff8c; --warning:#ffd700; --danger:#ff4444; --info:#00e5ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(ellipse at 15% 10%,rgba(0,255,140,.04) 0%,transparent 45%),
                    radial-gradient(ellipse at 85% 90%,rgba(0,180,255,.03) 0%,transparent 45%);}
.hdr{background:linear-gradient(180deg,#060a10,#0a1410);border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;padding:11px 20px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 20px rgba(0,0,0,.4);}
.hdr-left{display:flex;align-items:center;gap:12px;}
.logo{background:linear-gradient(135deg,#003322,#004d33);border:1px solid var(--accent2);border-radius:9px;
  padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.1em;}
.hdr h1{font-size:16px;font-weight:700;color:#fff;}
.hdr h1 span{color:var(--accent);}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:14px;}
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(0,255,140,.08);border:1px solid rgba(0,255,140,.25);
  border-radius:100px;padding:4px 11px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--success);}
.live-dot{width:6px;height:6px;background:var(--success);border-radius:50%;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

.statbar{display:flex;gap:10px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);}
.stat{flex-shrink:0;background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:10px 18px;text-align:center;min-width:100px;}
.stat .n{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;line-height:1;}
.stat .l{font-size:10px;color:var(--muted);margin-top:4px;}
.stat.total .n{color:var(--info)}.stat.ok .n{color:var(--success)}.stat.br .n{color:var(--danger)}.stat.un .n{color:var(--muted)}

.ctrl{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.ctrl select,.ctrl input{background:var(--card);border:1px solid var(--border2);color:var(--text);
  font-family:'Sarabun',sans-serif;font-size:13px;padding:7px 12px;border-radius:7px;outline:none;cursor:pointer;}
.ctrl select:focus,.ctrl input:focus{border-color:var(--accent2);}
.fbtn{padding:7px 14px;border-radius:7px;border:1px solid var(--border2);background:var(--card);color:var(--muted);
  font-family:'Sarabun',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;}
.fbtn:hover{border-color:var(--accent2);color:var(--accent);}
.fbtn.active{background:rgba(0,255,140,.1);border-color:var(--accent2);color:var(--accent);}
.fbtn.ok.active{background:rgba(0,255,140,.1);border-color:rgba(0,255,140,.4);color:var(--success);}
.fbtn.br.active{background:rgba(255,68,68,.1);border-color:rgba(255,68,68,.4);color:var(--danger);}
.search{flex:1;min-width:160px;font-family:'IBM Plex Mono',monospace;}
.search::placeholder{color:var(--muted);}
.exportbtn{background:linear-gradient(135deg,var(--ok-shd),var(--accent2));color:#001;border:none;border-radius:7px;
  font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer;}

main{padding:14px 20px 60px;}
.floor-grp{margin-bottom:22px;}
.floor-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.floor-lbl{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);
  background:rgba(0,255,140,.08);border:1px solid rgba(0,255,140,.2);border-radius:7px;padding:5px 14px;flex-shrink:0;}
.floor-div{flex:1;height:1px;background:var(--border);}
.floor-cnt{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}

.card{position:relative;border-radius:11px;padding:12px 12px 10px;cursor:pointer;transition:transform .12s;
  border:1px solid var(--border2);background:linear-gradient(160deg,var(--un-top),var(--un-mid));}
.card:hover{transform:translateY(-2px);}
.card.ok{background:linear-gradient(160deg,var(--ok-top),var(--ok-mid));border-color:var(--ok-bdr);box-shadow:0 0 14px -6px var(--ok-glow);}
.card.br{background:linear-gradient(160deg,var(--br-top),var(--br-mid));border-color:var(--br-bdr);box-shadow:0 0 14px -6px var(--br-glow);}
.card .id{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:#fff;}
.card .zn{display:inline-block;font-size:10px;font-family:'IBM Plex Mono',monospace;background:rgba(255,255,255,.08);
  border-radius:5px;padding:1px 6px;margin-left:5px;color:var(--muted);}
.card .loc{font-size:11.5px;color:var(--text);margin-top:6px;line-height:1.35;min-height:30px;}
.card .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;border-radius:100px;
  padding:3px 9px;margin-top:8px;}
.card.ok .badge{background:rgba(0,255,140,.15);color:var(--ok-txt);}
.card.br .badge{background:rgba(255,68,68,.15);color:var(--br-txt);}
.card.un .badge{background:rgba(106,138,176,.15);color:var(--un-txt);}
.dot{width:6px;height:6px;border-radius:50%;}
.card.ok .dot{background:var(--ok-txt);box-shadow:0 0 6px var(--ok-txt);}
.card.br .dot{background:var(--br-txt);box-shadow:0 0 6px var(--br-txt);animation:blink 1s infinite;}
.card.un .dot{background:var(--un-txt);}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);z-index:200;
  align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:14px;max-width:460px;width:100%;
  max-height:88vh;overflow-y:auto;padding:20px;}
.modal h2{font-size:16px;color:#fff;margin-bottom:2px;}
.modal .sub{font-size:12px;color:var(--muted);margin-bottom:16px;font-family:'IBM Plex Mono',monospace;}
.chk-item{border:1px solid var(--border2);border-radius:9px;padding:10px 12px;margin-bottom:9px;}
.chk-item label{font-size:12.5px;font-weight:600;color:var(--text);display:block;margin-bottom:7px;}
.chk-opts{display:flex;gap:6px;flex-wrap:wrap;}
.chk-opt{flex:1;min-width:70px;text-align:center;padding:7px 8px;border-radius:7px;border:1px solid var(--border2);
  background:var(--surface);font-size:11.5px;cursor:pointer;color:var(--muted);transition:all .12s;}
.chk-opt.sel-pass{background:rgba(0,255,140,.12);border-color:var(--accent2);color:var(--ok-txt);}
.chk-opt.sel-fail{background:rgba(255,68,68,.12);border-color:var(--br-bdr);color:var(--br-txt);}
.batt-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.batt-row input{width:80px;background:var(--surface);border:1px solid var(--border2);color:var(--text);
  border-radius:7px;padding:6px 9px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.batt-row span{font-size:11px;color:var(--muted);}
.overall{margin-top:14px;padding:12px;border-radius:9px;text-align:center;font-weight:700;font-size:13px;
  border:1px solid var(--border2);background:var(--surface);}
.overall.ok{color:var(--ok-txt);border-color:var(--ok-bdr);}
.overall.br{color:var(--br-txt);border-color:var(--br-bdr);}
textarea{width:100%;background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:8px;
  padding:9px;font-family:'Sarabun',sans-serif;font-size:12.5px;margin-top:10px;resize:vertical;min-height:50px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn-save{flex:1;background:linear-gradient(135deg,var(--ok-shd),var(--accent2));color:#001;border:none;
  border-radius:8px;padding:11px;font-family:'Sarabun',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;}
.btn-cancel{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:8px;
  padding:11px 16px;font-family:'Sarabun',sans-serif;font-size:13px;cursor:pointer;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent2);
  color:var(--accent);padding:10px 20px;border-radius:9px;font-size:13px;z-index:300;display:none;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
@media(max-width:640px){.hdr h1{font-size:13px;}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div class="logo">EX</div>
    <div>
      <h1>EX <span>Monitoring Dashboard</span></h1>
      <div class="hdr-sub">ป้ายทางหนีไฟ (Exit Signage) · ตึกภูมิสิริมังคลานุสรณ์ รพ.จุฬาลงกรณ์</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="live-badge" id="syncBadge"><div class="live-dot" id="syncDot"></div><span id="syncText">LOCAL ONLY</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</div>

<div class="statbar">
  <div class="stat total"><div class="n" id="statTotal">0</div><div class="l">ทั้งหมด</div></div>
  <div class="stat ok"><div class="n" id="statOk">0</div><div class="l">ปกติ</div></div>
  <div class="stat br"><div class="n" id="statBr">0</div><div class="l">ชำรุด</div></div>
  <div class="stat un"><div class="n" id="statUn">0</div><div class="l">ยังไม่ตรวจ</div></div>
</div>

<div class="ctrl">
  <input class="search" id="searchBox" placeholder="ค้นหาเลขป้าย / ตำแหน่ง..." oninput="applyFilter()">
  <select id="floorSel" onchange="applyFilter()"><option value="">ทุกชั้น</option></select>
  <select id="zoneSel" onchange="applyFilter()">
    <option value="">ทุกโซน</option><option value="A">โซน A</option><option value="B">โซน B</option>
    <option value="C">โซน C</option><option value="D">โซน D</option>
  </select>
  <button class="fbtn ok" id="fbtnOk" onclick="toggleStatusFilter('ok',this)">ปกติ</button>
  <button class="fbtn br" id="fbtnBr" onclick="toggleStatusFilter('br',this)">ชำรุด</button>
  <button class="fbtn" id="fbtnUn" onclick="toggleStatusFilter('un',this)">ยังไม่ตรวจ</button>
  <button class="exportbtn" onclick="exportCSV()">⬇ Export CSV</button>
</div>

<main id="mainArea"></main>

<div class="modal-bg" id="modalBg" onclick="closeOut(event)">
  <div class="modal" id="modal">
    <h2 id="mTitle">-</h2>
    <div class="sub" id="mSub">-</div>

    <div class="chk-item">
      <label>1. ทดสอบสวิตซ์ไฟฉุกเฉิน (Push-to-test)</label>
      <div class="chk-opts" id="chkSwitch">
        <div class="chk-opt" onclick="setChk('switch','pass',this)">✓ ปกติ</div>
        <div class="chk-opt" onclick="setChk('switch','fail',this)">✕ เสีย</div>
      </div>
    </div>

    <div class="chk-item">
      <label>2. ความสว่าง / สภาพหลอด LED</label>
      <div class="chk-opts" id="chkLed">
        <div class="chk-opt" onclick="setChk('led','pass',this)">✓ ปกติ</div>
        <div class="chk-opt" onclick="setChk('led','fail',this)">✕ ริบหรี่/ดับ</div>
      </div>
    </div>

    <div class="chk-item">
      <label>3. เวลาสำรองไฟแบตเตอรี่ (เกณฑ์ขั้นต่ำ 90 นาที)</label>
      <div class="chk-opts" id="chkBatt">
        <div class="chk-opt" onclick="setChk('batt','pass',this)">✓ ผ่าน</div>
        <div class="chk-opt" onclick="setChk('batt','fail',this)">✕ ไม่ผ่าน</div>
      </div>
      <div class="batt-row"><input type="number" id="battMin" placeholder="0" min="0"><span>นาทีที่วัดได้ (ถ้ามี)</span></div>
    </div>

    <div class="chk-item">
      <label>4. สภาพตัวป้าย / โครงยึด / สายไฟ</label>
      <div class="chk-opts" id="chkBody">
        <div class="chk-opt" onclick="setChk('body','pass',this)">✓ ปกติ</div>
        <div class="chk-opt" onclick="setChk('body','fail',this)">✕ ชำรุด</div>
      </div>
    </div>

    <div class="overall" id="overallBox">กรุณาตรวจครบทั้ง 4 ข้อ</div>
    <textarea id="noteBox" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-save" onclick="saveCheck()">บันทึกผล PM</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>

/* ===== CONFIG =====
   หลังจาก deploy Apps Script (Code.gs) เป็น Web App แล้ว ให้นำ URL ที่ได้
   (ลงท้ายด้วย /exec) มาใส่ในนี้ แล้ว re-deploy ไฟล์นี้ขึ้น GitHub Pages ใหม่ */
const GS_URL = 'https://script.google.com/macros/s/AKfycbylSyDmcQ0f8f3Pgcsr1FCY7c7mSfdgCoph0TPRGWQzUji3egflMRmmEbsqRQN8Ojw-zw/exec';
const INSPECTOR_NAME = ''; // ใส่ชื่อผู้ตรวจ (ถ้าต้องการบันทึกลง log), เว้นว่างได้

/* ===== STATE ===== */
let overrides = {};      // id -> {status, checklist, note, ts}
let statusFilters = new Set();

function loadOverrides(){
  try{ overrides = JSON.parse(localStorage.getItem('ex_status')||'{}'); }catch(e){ overrides={}; }
}
function saveOverrides(){
  try{ localStorage.setItem('ex_status', JSON.stringify(overrides)); }catch(e){}
}

function getStatus(idx){
  const id = RAW[idx][0];
  if (overrides[id] && typeof overrides[id].status === 'number') return overrides[id].status;
  return RAW[idx][2];
}

function floorOrder(fl){
  if (fl.startsWith('B')){ const n=parseInt(fl.slice(1)); return isNaN(n)?-99:-n; }
  if (fl === 'MZ') return 0.5;
  const n=parseInt(fl); return isNaN(n)?99:n;
}

function machineIdOrder(id){
  const m = id.match(/\/(\d+)/);
  return m ? parseInt(m[1]) : 0;
}

/* ===== SYNC WITH GOOGLE SHEETS ===== */
function setSyncStatus(state, text){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncText');
  label.textContent = text;
  dot.style.background = state==='ok' ? 'var(--success)' : state==='err' ? 'var(--danger)' : 'var(--muted)';
}

async function syncFromSheets(){
  if (!GS_URL){
    setSyncStatus('off', 'LOCAL ONLY');
    return;
  }
  setSyncStatus('busy', 'SYNCING...');
  try{
    const res = await fetch(`${GS_URL}?action=getLatest`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'sync failed');
    // data.latest: { MachineID: {Timestamp, Switch, LED, Battery, BatteryMin, Body, OverallStatus, Note, Inspector} }
    Object.keys(data.latest).forEach(id=>{
      const row = data.latest[id];
      const overall = String(row.OverallStatus||'').toLowerCase();
      const status = overall === 'ปกติ' || overall === 'ok' ? 1 : (overall ? 2 : 0);
      overrides[id] = {
        status,
        checklist: { switch: row.Switch, led: row.LED, batt: row.Battery, battMin: row.BatteryMin, body: row.Body },
        note: row.Note || '',
        ts: row.Timestamp || ''
      };
    });
    saveOverrides();
    render();
    setSyncStatus('ok', 'SYNCED · ' + new Date().toLocaleTimeString('th-TH',{hour12:false}));
  }catch(err){
    setSyncStatus('err', 'SYNC ERROR');
    console.error(err);
  }
}

async function pushToSheet(record){
  if (!GS_URL) return; // ยังไม่ตั้งค่า URL -> เก็บแค่ local
  try{
    await fetch(GS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // เลี่ยง CORS preflight ของ Apps Script
      body: JSON.stringify({ action: 'savePM', ...record })
    });
  }catch(err){
    console.error('pushToSheet failed', err);
    showToast('บันทึกลง local แล้ว แต่ sync ขึ้น Sheet ไม่สำเร็จ (จะลองใหม่ตอน sync ครั้งถัดไป)');
  }
}

function startAutoSync(intervalMs = 30000){
  if (!GS_URL) return;
  syncFromSheets();
  setInterval(syncFromSheets, intervalMs);
}

/* ===== CLOCK ===== */
function updateClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('th-TH', {hour12:false});
}
setInterval(updateClock, 1000); updateClock();

/* ===== FILTER UI ===== */
function toggleStatusFilter(key, el){
  if (statusFilters.has(key)){ statusFilters.delete(key); el.classList.remove('active'); }
  else { statusFilters.add(key); el.classList.add('active'); }
  applyFilter();
}

function populateFloorSelect(){
  const floors = [...new Set(RAW.map(r=>r[5]))].sort((a,b)=>floorOrder(a)-floorOrder(b));
  const sel = document.getElementById('floorSel');
  floors.forEach(f=>{
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = 'ชั้น ' + f;
    sel.appendChild(opt);
  });
}

function passFilter(idx){
  const r = RAW[idx];
  const st = getStatus(idx);
  const stKey = st===1?'ok':st===2?'br':'un';
  if (statusFilters.size>0 && !statusFilters.has(stKey)) return false;
  const floorSel = document.getElementById('floorSel').value;
  if (floorSel && r[5] !== floorSel) return false;
  const zoneSel = document.getElementById('zoneSel').value;
  if (zoneSel && r[4] !== zoneSel) return false;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if (q && !(r[0].toLowerCase().includes(q) || r[3].toLowerCase().includes(q))) return false;
  return true;
}

/* ===== RENDER ===== */
function render(){
  const main = document.getElementById('mainArea');
  main.innerHTML = '';
  const idxs = RAW.map((_,i)=>i).filter(passFilter);
  if (idxs.length===0){
    main.innerHTML = '<div class="empty">ไม่พบรายการที่ตรงกับตัวกรอง</div>';
    updateStats();
    return;
  }
  const byFloor = {};
  idxs.forEach(i=>{
    const fl = RAW[i][5];
    (byFloor[fl] = byFloor[fl]||[]).push(i);
  });
  const floors = Object.keys(byFloor).sort((a,b)=>floorOrder(a)-floorOrder(b));
  floors.forEach(fl=>{
    const items = byFloor[fl].sort((a,b)=> RAW[a][4].localeCompare(RAW[b][4]) || machineIdOrder(RAW[a][0])-machineIdOrder(RAW[b][0]));
    const grp = document.createElement('div');
    grp.className = 'floor-grp';
    grp.innerHTML = `<div class="floor-hdr">
        <div class="floor-lbl">ชั้น ${fl}</div><div class="floor-div"></div>
        <div class="floor-cnt">${items.length} จุด</div>
      </div><div class="grid" id="grid_${fl}"></div>`;
    main.appendChild(grp);
    const grid = grp.querySelector('.grid');
    items.forEach(i=>{
      const r = RAW[i];
      const st = getStatus(i);
      const cls = st===1?'ok':st===2?'br':'un';
      const label = st===1?'ปกติ':st===2?'ชำรุด':'ยังไม่ตรวจ';
      const card = document.createElement('div');
      card.className = 'card ' + cls;
      card.onclick = ()=>openModal(i);
      card.innerHTML = `
        <div><span class="id">${r[0]}</span><span class="zn">${r[4]||'-'}</span></div>
        <div class="loc">${r[3]||'-'}</div>
        <div class="badge"><span class="dot"></span>${label}</div>`;
      grid.appendChild(card);
    });
  });
  updateStats();
}

function updateStats(){
  let ok=0, br=0, un=0;
  RAW.forEach((r,i)=>{
    const st = getStatus(i);
    if (st===1) ok++; else if (st===2) br++; else un++;
  });
  document.getElementById('statTotal').textContent = RAW.length;
  document.getElementById('statOk').textContent = ok;
  document.getElementById('statBr').textContent = br;
  document.getElementById('statUn').textContent = un;
}

function applyFilter(){ render(); }

/* ===== MODAL / PM CHECKLIST ===== */
let curIdx = null;
let curChk = {switch:null, led:null, batt:null, body:null};

function openModal(idx){
  curIdx = idx;
  curChk = {switch:null, led:null, batt:null, body:null};
  const r = RAW[idx];
  document.getElementById('mTitle').textContent = r[0];
  document.getElementById('mSub').textContent = `ชั้น ${r[5]} · โซน ${r[4]||'-'} · ${r[3]||'-'}`;
  document.getElementById('battMin').value = '';
  document.getElementById('noteBox').value = '';
  ['chkSwitch','chkLed','chkBatt','chkBody'].forEach(id=>{
    document.getElementById(id).querySelectorAll('.chk-opt').forEach(o=>o.classList.remove('sel-pass','sel-fail'));
  });
  // preload existing override
  const ov = overrides[r[0]];
  if (ov && ov.checklist){
    curChk = {...ov.checklist};
    document.getElementById('battMin').value = ov.checklist.battMin || '';
    document.getElementById('noteBox').value = ov.note || '';
    reflectChk();
  }
  updateOverall();
  document.getElementById('modalBg').classList.add('show');
}

function closeModal(){ document.getElementById('modalBg').classList.remove('show'); curIdx=null; }
function closeOut(e){ if (e.target.id === 'modalBg') closeModal(); }

function setChk(key, val, el){
  curChk[key] = val;
  el.parentElement.querySelectorAll('.chk-opt').forEach(o=>o.classList.remove('sel-pass','sel-fail'));
  el.classList.add(val==='pass'?'sel-pass':'sel-fail');
  updateOverall();
}

function reflectChk(){
  const map = {switch:'chkSwitch', led:'chkLed', batt:'chkBatt', body:'chkBody'};
  Object.keys(map).forEach(k=>{
    if (!curChk[k]) return;
    const box = document.getElementById(map[k]);
    const opts = box.querySelectorAll('.chk-opt');
    const target = curChk[k]==='pass'? opts[0] : opts[1];
    target.classList.add(curChk[k]==='pass'?'sel-pass':'sel-fail');
  });
}

function updateOverall(){
  const box = document.getElementById('overallBox');
  const vals = [curChk.switch, curChk.led, curChk.batt, curChk.body];
  if (vals.some(v=>v===null)){
    box.className = 'overall';
    box.textContent = 'กรุณาตรวจครบทั้ง 4 ข้อ';
    return;
  }
  const allPass = vals.every(v=>v==='pass');
  box.className = 'overall ' + (allPass?'ok':'br');
  box.textContent = allPass ? '✓ สรุปผล: ปกติ' : '✕ สรุปผล: ชำรุด (มีอย่างน้อย 1 ข้อไม่ผ่าน)';
}

function saveCheck(){
  if (curIdx===null) return;
  const vals = [curChk.switch, curChk.led, curChk.batt, curChk.body];
  if (vals.some(v=>v===null)){
    showToast('กรุณาตรวจให้ครบทั้ง 4 ข้อก่อนบันทึก');
    return;
  }
  const r = RAW[curIdx];
  const allPass = vals.every(v=>v==='pass');
  const battMin = document.getElementById('battMin').value;
  const note = document.getElementById('noteBox').value;
  const overallLabel = allPass ? 'ปกติ' : 'ชำรุด';
  overrides[r[0]] = {
    status: allPass?1:2,
    checklist: {...curChk, battMin},
    note,
    ts: new Date().toISOString()
  };
  saveOverrides();
  closeModal();
  render();
  showToast(`บันทึกผล PM ${r[0]} เรียบร้อย` + (GS_URL ? ' (กำลัง sync ขึ้น Sheet...)' : ''));

  pushToSheet({
    machineId: r[0],
    switch: curChk.switch,
    led: curChk.led,
    battery: curChk.batt,
    batteryMin: battMin,
    body: curChk.body,
    overallStatus: overallLabel,
    note,
    inspector: INSPECTOR_NAME
  });
}

/* ===== TOAST ===== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2500);
}

/* ===== EXPORT CSV ===== */
function exportCSV(){
  const rows = [['Machine ID','Asset No','Status','Location','Zone','Floor','Dept','Switch','LED','Battery','BatteryMin','Body','Note','LastUpdate']];
  RAW.forEach((r,i)=>{
    const st = getStatus(i);
    const stLabel = st===1?'ปกติ':st===2?'ชำรุด':'ยังไม่ตรวจ';
    const ov = overrides[r[0]] || {};
    const c = ov.checklist || {};
    rows.push([r[0], r[1], stLabel, r[3], r[4], r[5], r[6],
      c.switch||'', c.led||'', c.batt||'', c.battMin||'', c.body||'', ov.note||'', ov.ts||'']);
  });
  const csv = rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `EX_Status_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

startAutoSync(30000);
